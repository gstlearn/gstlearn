name: nonreg-tests_macos-latest

on:
  # Permit calling trigger
  workflow_call:
  # Activate the workflow at each push on dev branch
  #push:
  #  branches: [ dev ]
  # Activate the workflow at each pull request on dev branch
  #pull_request:
  #  branches: [ dev ]
  # Permit manual trigger
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Manual'
        required: false
        default: ''

env:
  CMAKE_BUILD_TYPE : Release
  BUILD_DIR : build
  PYTHON_VERSION : "3.14"
  R_VERSION : "4.5.2"
  SWIG_ROOT : ${{github.workspace}}/swig
  LLVM_ROOT : /opt/homebrew
  GSTLEARN_OUTPUT_DIR: ${{ github.workspace }}/build/gstlearn_dir

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        brew update
        brew install llvm
        brew install bison
        brew install boost
        brew install eigen
        brew install nlopt
        brew install hdf5
        brew install python-tk # for gdal
        brew install gdal || true  # for terra
        echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH

    - name: Setup Python
      uses: ./.github/actions/setup_python
      with:
        python-version: ${{env.PYTHON_VERSION}}

    - name: Setup R
      uses: ./.github/actions/setup_r
      with:
        r-version: ${{env.R_VERSION}}
        extra-repositories: "https://mac.r-project.org"

    - name: Install the customized SWIG from source
      uses: fabien-ors/install-swig-unix-action@v1
      with:
        swig-root: ${{env.SWIG_ROOT}}
        generator: "Unix Makefiles"

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.10

    - name: Configure build directory
      run: |
        cmake \
          -B${{ env.BUILD_DIR }} \
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
          -DBUILD_TESTING=ON \
          -DBUILD_PYTHON=ON \
          -DBUILD_R=ON \
          -DSWIG_EXECUTABLE=${{env.SWIG_ROOT}}/bin/swig
      env:
        CC: ${{env.LLVM_ROOT}}/opt/llvm/bin/clang
        CXX: ${{env.LLVM_ROOT}}/opt/llvm/bin/clang++
        SCCACHE_GHA_ENABLED: "true"
        CMAKE_CC_COMPILER_LAUNCHER: sccache
        CMAKE_CXX_COMPILER_LAUNCHER: sccache

    - name: Build the package
      run: |
        cmake --build ${{env.BUILD_DIR}} --parallel 3

    - name: Install packages and execute non-regression tests
      run: |
        cmake --build ${{env.BUILD_DIR}} --target check

    - name: Compress and upload artifacts
      if: always()
      uses: ./.github/actions/compress_and_upload_nonreg_artifacts
      with:
        os-name: macos
