name: coverage-tests_r

on:
  # Permit calling trigger
  workflow_call:
  # Permit manual trigger
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Manual'
        required: false
        default: ''

jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        # Last releases from here https://cran.r-project.org/src/base/R-4/
        r_version: [4.2.3, 4.3.3, 4.4.3, 4.5.3, 4.6.0]
        # See the list here: https://github.com/actions/runner-images#available-images
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-2025, macos-14, macos-15, macos-15-intel, macos-26]
        exclude:
          - os: ubuntu-22.04
            r_version: 4.2.3  # ggpubr install fails
          - os: ubuntu-24.04
            r_version: 4.2.3  # ggpubr install fails

    steps:
    - uses: actions/checkout@v6

    - name: Setup R Version
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{matrix.r_version}}

    - name: Install R dependencies
      if: ${{ contains(matrix.os, 'ubuntu') }}
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: ggpubr, ggplot2, ggnewscale
        install-pandoc: false

    - name: Install R dependencies (binary)
      if: ${{ !contains(matrix.os, 'ubuntu') }}
      run: Rscript -e "install.packages (c('ggplot2', 'ggpubr', 'ggnewscale'), type='binary')"

    - name: Install gstlearn
      run: Rscript -e "install.packages(c('gstlearn'), repos='https://soft.mines-paristech.fr/cran/', dependencies = TRUE)"

    - name: Run the r tests
      uses: ./.github/actions/run_r_tests
